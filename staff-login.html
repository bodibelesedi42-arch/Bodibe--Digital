<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Staff Login | Bodibe Digital</title>
    <meta name="robots" content="noindex, nofollow" />

    <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />

    <!-- Theme: apply saved/system preference before first paint (no flash) -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t !== "dark" && t !== "light") {
            t =
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    <script src="theme.js" defer></script>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="staff-login.css" />
  </head>

  <body class="portal-body">

<a href="#main" class="skip-link">Skip to content</a>
    <div class="background-animation">
      <span></span><span></span><span></span><span></span><span></span><span></span>
    </div>

    <header>
      <nav class="navbar">
        <a href="index.html" class="logo">
          <div class="logo-mark">
            <img src="assets/images/logo.svg" alt="Bodibe Digital Logo" class="logo-mark-dark">
            <img src="assets/images/logo.svg" alt="Bodibe Digital Logo" class="logo-mark-light">
          </div>
          <div class="logo-details">
            <h2>Bodibe</h2>
            <small>DIGITAL</small>
          </div>
        </a>
        <span class="portal-chip"><i class="fa-solid fa-building"></i><span>Business Portal</span></span>
        <button type="button" class="theme-toggle" aria-label="Switch to light mode" aria-pressed="false">
          <svg class="theme-toggle-icon theme-toggle-icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4.2" fill="currentColor"/><g stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="12" y1="1.5" x2="12" y2="4.2"/><line x1="12" y1="19.8" x2="12" y2="22.5"/><line x1="1.5" y1="12" x2="4.2" y2="12"/><line x1="19.8" y1="12" x2="22.5" y2="12"/><line x1="4.4" y1="4.4" x2="6.3" y2="6.3"/><line x1="17.7" y1="17.7" x2="19.6" y2="19.6"/><line x1="4.4" y1="19.6" x2="6.3" y2="17.7"/><line x1="17.7" y1="6.3" x2="19.6" y2="4.4"/></g></svg>
          <svg class="theme-toggle-icon theme-toggle-icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path fill="currentColor" d="M20.4 14.7A8.6 8.6 0 1 1 9.3 3.6a7 7 0 0 0 11.1 11.1z"/></svg>
        </button>
      </nav>
    </header>

    <main id="main" class="staff-page">

      <!-- 3D STAGE: everything inside tilts together with the cursor -->
      <div class="staff-stage" id="staffStage">

        <div class="stage-plane" aria-hidden="true"></div>
        <div class="stage-orb stage-orb-a" aria-hidden="true"></div>
        <div class="stage-orb stage-orb-b" aria-hidden="true"></div>

        <div class="staff-card" id="staffCard">
          <div class="staff-card-sheen" aria-hidden="true"></div>

          <span class="staff-label">BODIBE DIGITAL</span>
          <h1>Welcome back.</h1>
          <p class="staff-subtitle">Sign in with your work email and password to reach your projects and tasks.</p>

          <div class="staff-error" id="loginError"></div>

          <form class="staff-form" id="loginForm">
            <div class="staff-field">
              <label for="email">Email</label>
              <div class="staff-input-shell">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" id="email" name="email" placeholder="you@bodibedigital.co.za" required autocomplete="username" />
              </div>
            </div>

            <div class="staff-field">
              <label for="password">Password</label>
              <div class="staff-input-shell">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password" />
              </div>
            </div>

            <button type="submit" class="staff-submit" id="submitBtn">
              Sign In
              <i class="fa-solid fa-arrow-right"></i>
            </button>
          </form>

          <a href="index.html" class="staff-back">← Back to website</a>
        </div>

      </div>

    </main>

    <script src="portal-effects.js"></script>
    <script src="staff-login.js"></script>
  </body>
</html>
